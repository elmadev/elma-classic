name: CI

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
      - "**/docs/**"
      - "**.txt"
  pull_request:
    paths-ignore:
      - "**.md"
      - "**/docs/**"
      - "**.txt"

env:
  EMSCRIPTEN_VERSION: 6.0.13
  EMSCRIPTEN_CACHE: "emsdk-cache"

jobs:
  clang-format:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-21 libgl1-mesa-dev
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-21 100
          sudo update-alternatives --set clang-format /usr/bin/clang-format-21
          clang-format --version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install meson==1.10.0 ninja

      - name: Configure
        run: meson setup build

      - name: Check formatting
        run: ninja -C build clang-format-check

  clang-tidy:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-21 libgl1-mesa-dev

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install meson==1.10.0 ninja

      - name: Configure
        run: meson setup build

      - name: Run clang-tidy
        run: meson test -C build --suite clang-tidy --print-errorlogs

      - name: Upload clang-tidy results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-results
          path: build/meson-logs/testlog.txt
          retention-days: 5

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
          - os: windows-2025
          - os: macos-26
          - os: macos-15-intel
            arch: x86_64
          - os: ubuntu-26.04
            emscripten: true
          - os: windows-2025
            emscripten: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache Meson subprojects
        uses: actions/cache@v5
        with:
          path: subprojects/packagecache
          key: ${{ runner.os }}-${{ matrix.arch || 'default' }}${{ matrix.emscripten && '-emscripten' || '' }}-meson-${{ hashFiles('subprojects/*.wrap') }}

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        if: ${{ !matrix.emscripten }}
        with:
          variant: sccache
          key: ${{ runner.os }}-${{ matrix.arch || 'default' }}${{ matrix.emscripten && '-emscripten' || '' }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install meson==1.10.0 ninja

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxss-dev libxinerama-dev libxxf86vm-dev \
            libegl-dev libgbm-dev \
            libpulse-dev libasound2-dev libdbus-1-dev libudev-dev libibus-1.0-dev

      - name: Configure system dependencies (macos-26)
        if: matrix.os == 'macos-26'
        run: |
          # latest libcurl port to meson is curl-8.12.1
          # curl-8.12.1 only supports openssl 3
          # curl-8.20.0 supports openssl 4.0
          # curl-8.23.0 supports openssl 4.1
          # downgrade openssl from 4 to 3
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          echo "PKG_CONFIG_PATH=$OPENSSL_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Visual Studio
        if: runner.os == 'windows' && !matrix.emscripten
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: "[17.1,19.0)"

      - name: Emscripten
        uses: emscripten-core/setup-emsdk@v15
        if: matrix.emscripten
        with:
          version: ${{env.EMSCRIPTEN_VERSION}}
          actions-cache-folder: ${{env.EMSCRIPTEN_CACHE}}

      - name: Configure
        shell: bash
        run: |
          args=()
          if [[ "${{ matrix.emscripten }}" == "true" ]]; then
            args+=(--cross-file emscripten.ini)
          elif [[ "${{ runner.os }}" == "windows" ]]; then
            args+=(--vsenv)
          else
            args+=(-Dstatic_sdl=true)
          fi
          meson setup build -Dbuildtype=release "${args[@]}"

      - name: Build
        run: meson compile -C build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: elma-${{ runner.os }}-${{ matrix.arch || 'default' }}${{ matrix.emscripten && '-emscripten' || '' }}
          path: |
            build/elma
            build/elma.exe
            build/output.html
            build/output.js
            build/output.wasm
          retention-days: 5
          if-no-files-found: ignore
